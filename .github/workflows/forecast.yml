name: Previsión diaria
on:
  schedule:
    - cron: "40 4 * * *"   # 6:40 en verano y 5:40 en invierno (hora de Madrid)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-forecast.mjs
      - name: Guardar
        run: |
          git config user.name "boletaire-bot"
          git config user.email "boletaire-bot@users.noreply.github.com"
          git add data/forecast.json data/history.json
          git diff --cached --quiet || git commit -m "Previsión $(date -u +%F)"
          git push
